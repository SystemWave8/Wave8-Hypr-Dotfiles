##############################
### WINDOWS AND WORKSPACES ###
##############################


##### WEB APPS & Standard Locations #######

windowrule {
    name = chrome-www.youtube.com__-Default
    match:class = ^chrome-www\.youtube\.com__-Default$

    workspace = 4
}

windowrule {
    name = ChatGPT
    match:class = ^chrome-chat\.openai\.com__-Default$

    workspace = 3
}

windowrule {
    name = HyprlandWiki
    match:class = ^chrome-wiki\.hyprland\.org__-Default$

    workspace = 5
}

windowrule {
    name = GitHub
    match:class = ^chrome-github\.com__SystemWave8_Wave8-Hypr-Dotfiles-Default$

    workspace = 6
}

windowrule {
    name = Thunderbird
    match:class = ^thunderbird$

    workspace = 2
}

windowrule {
    name = ThunderbirdFlatpak
    match:class = ^org.mozilla.Thunderbird$

    workspace = 2
}

windowrule {
    name = Yad
    match:class = ^yad$

    float = on
    size = 654 251
    move = 614 344
}

windowrule {
    name = Zenity
    match:class = ^zenity$

    pin = on
}

windowrule {
    name = Weather
    match:class = ^org.gnome.Weather$

    float = on
    size = 989 506
    move = 448 38
}

windowrule {
    name = Impala
    match:class = ^Impala$

    float = on
    size = 800 600
    move = 560 253
}

windowrule {
    name = Wiremix
    match:class = ^Wiremix$

    float = on
    size = 800 600
    move = 560 253
}

windowrule {
    name = Bluetooth
    match:class = ^blueman-manager$

    float = on
    size = 535 535
    move = 641 242
}
