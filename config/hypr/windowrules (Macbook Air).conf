##############################
### WINDOWS AND WORKSPACES ###
##############################

# See https://wiki.hypr.land/Configuring/Window-Rules/ for more
# See https://wiki.hypr.land/Configuring/Workspace-Rules/ for workspace rules

##### BY CLASS #######

# Pithos (music)
#windowrulev2 = workspace 1,class:^(pithos)$
#windowrulev2 = float,class:^(pithos)$
#windowrulev2 = size 338 585,class:^(pithos)$
#windowrulev2 = move 9 35,class:^(pithos)$

# Pithos (music)
windowrule {
    name = Pithos
    match:class = ^pithos$

    workspace = 1
    float = on
    size = 338 856
    move = 9 35
}


# Cavalier
windowrule {
    name = Cavalier
    match:class = ^org.nickvision.cavalier$

    workspace = 1
    float = on
    size = 338 259
    move = 9 632
}

